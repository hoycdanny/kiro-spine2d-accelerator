[project]
name = "spine-psd-sidecar"
version = "0.1.0"
description = "PSD to Spine skeleton generation sidecar for the Kiro Spine 2D Power"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "psd-tools==1.10.7",
    "Pillow==11.0.0",
    "rectpack==0.2.2",
]

[project.scripts]
spine-psd-sidecar = "spine_psd.cli:main"

[dependency-groups]
dev = ["pytest==8.3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spine_psd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
